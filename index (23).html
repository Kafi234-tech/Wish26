<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wish</title>
    <style>
        /* বেসিক স্টাইল */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .active {
            display: flex;
        }

        /* Page 1: Password Section */
        #page1 h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #e94560;
        }
        #page1 input {
            padding: 10px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0f3460;
        }
        #errorMsg {
            color: red;
            margin-top: 10px;
            display: none;
        }

        /* Page 2: Nostalgia Section */
        #welcomeBtn {
            font-size: 1.5rem;
            padding: 15px 30px;
            background-color: #0f3460;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .film-container {
            display: none;
            position: absolute;
            bottom: -100%;
            width: 90%;
            max-width: 400px;
            background-color: #000;
            padding: 20px 10px;
            border-left: 10px dashed white;
            border-right: 10px dashed white;
            flex-direction: column;
            align-items: center;
        }

        /* সিনেমার টেপের অ্যানিমেশন */
        @keyframes scrollUp {
            0% { bottom: -100%; }
            100% { bottom: 100%; }
        }

        .animate-film {
            display: flex;
            animation: scrollUp 40s linear forwards;
        }

        .photo-frame {
            margin-bottom: 30px;
            text-align: center;
            background: white;
            padding: 10px;
            border-radius: 5px;
        }
        .photo-frame img {
            width: 100%;
            height: auto;
            border-radius: 3px;
        }
        .photo-frame .note {
            color: black;
            font-weight: bold;
            margin-top: 10px;
            font-size: 1rem;
        }

        #nextPageBtn {
            display: none;
            position: absolute;
            bottom: 20%;
            z-index: 20;
            background-color: #4caf50;
        }

        /* Page 3: Birthday Wishes */
        #page3 h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .bn { color: #ff9a9e; }
        .en { color: #fecfef; }
        .ur { color: #a18cd1; }
        .hi { color: #fbc2eb; }
        .es { color: #8fd3f4; }
    </style>
</head>
<body>

    <!-- অডিও ফাইল -->
    <audio id="bgm" src="song.mp3"></audio>

    <!-- ১ম পেজ: পাসওয়ার্ড -->
    <div id="page1" class="page active">
        <h2>guess the password for the access</h2>
        <input type="password" id="password" placeholder="Password...">
        <button onclick="checkPassword()">done</button>
        <p id="errorMsg">ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</p>
    </div>

    <!-- ২য় পেজ: নস্টালজিয়া -->
    <div id="page2" class="page">
        <button id="welcomeBtn" onclick="startNostalgia()">welcome to nostalgia</button>
        
        <!-- সিনেমার টেপ -->
        <div class="film-container" id="filmStrip">
            <div class="photo-frame">
                <img src="img1.png" alt="Pic 1">
                <div class="note">প্রথম স্মৃতি...</div>
            </div>
            <div class="photo-frame">
                <img src="img2.png" alt="Pic 2">
                <div class="note">সুন্দর মুহূর্ত...</div>
            </div>
            <div class="photo-frame">
                <img src="img3.png" alt="Pic 3">
                <div class="note">হাসি মাখা মুখ🤐</div>
            </div>
            <div class="photo-frame">
                <img src="img4.png" alt="Pic 4">
                <div class="note">অসাধারণ দিন...</div>
            </div>
            <div class="photo-frame">
                <img src="img5.png" alt="Pic 5">
                <div class="note">Queen 👑</div>
            </div>
            <div class="photo-frame">
                <img src="img6.png" alt="Pic 6">
                <div class="note">দাড়িয়ে থেকে ভাব নেই..</div>
            </div>
            <div class="photo-frame">
                <img src="img7.png" alt="Pic 7">
                <div class="note">চশমা পড়ে ঢং করি</div>
            </div>
        </div>

        <button id="nextPageBtn" onclick="goToPage3()">শেষ পাতা</button>
    </div>

    <!-- ৩য় পেজ: শুভেচ্ছা -->
    <div id="page3" class="page">
        <h1 class="bn">শুভ জন্মদিন</h1>
        <h1 class="en">Happy Birthday</h1>
        <h1 class="ur">سالگرہ مبارک</h1>
        <h1 class="hi">जन्मदिन की शुभकामनाएँ</h1>
        <h1 class="es">Feliz Cumpleaños</h1>
    </div>

    <script>
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const page3 = document.getElementById('page3');
        const bgm = document.getElementById('bgm');
        const filmStrip = document.getElementById('filmStrip');
        const welcomeBtn = document.getElementById('welcomeBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');

        function checkPassword() {
            const pass = document.getElementById('password').value;
            if (pass === "1972003") {
                page1.classList.remove('active');
                page2.classList.add('active');
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

                function startNostalgia() {
            welcomeBtn.style.display = 'none';
            bgm.play();
            filmStrip.classList.add('animate-film');

            filmStrip.addEventListener('animationend', () => {
                nextPageBtn.style.display = 'block'; // গান এখন আর বন্ধ হবে না
            });
        }


        function goToPage3() {
            page2.classList.remove('active');
            page3.classList.add('active');
        }
    </script>

</body>
</html>
